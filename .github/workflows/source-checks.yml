name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m compileall -q learnibridge flux hunyuan wan scripts run.py
      - run: python scripts/check_source.py
      - run: python scripts/validate_schedule.py
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python scripts/validate_core.py
      - run: python scripts/train_schedule.py --model flux --ckpt-dir /tmp/model --feature-roots /tmp/features/0 --output-dir /tmp/adapters --dry-run
      - run: python -m pip wheel --no-deps --wheel-dir /tmp/wheels .
