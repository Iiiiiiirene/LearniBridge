[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learnibridge-core"
version = "0.1.0.dev0"
description = "Learnable final-block calibration for diffusion feature caching"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
flux = ["diffusers==0.40.0", "transformers==5.14.1", "accelerate", "sentencepiece", "safetensors"]

[project.urls]
Repository = "https://github.com/Iiiiiiirene/LearniBridge"
Issues = "https://github.com/Iiiiiiirene/LearniBridge/issues"

[tool.setuptools.packages.find]
include = ["learnibridge*"]
